services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-polyflux}
      POSTGRES_USER: ${POSTGRES_USER:-polyflux}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-polyflux}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-polyflux} -d ${POSTGRES_DB:-polyflux}"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      SERVER_PORT: 8081
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-polyflux}
      DATABASE_USER: ${POSTGRES_USER:-polyflux}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-polyflux}
      ULPF_CORS_ALLOWED_ORIGINS: ${ULPF_CORS_ALLOWED_ORIGINS:-http://localhost:8080}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build: ./frontend
    environment:
      NITRO_PORT: 8080
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      - backend
volumes:
  postgres-data:
